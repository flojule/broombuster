name: "Belvedere, CA"
source_updated: "2023-05"   # the city's sweeping map
center: {lat: 37.8705, lon: -122.4640}
schema: prebuilt
bbox: [37.862, -122.475, 37.885, -122.456]
fgb_path: data/belvedere/StreetSweeping.fgb
streetview_since: "2023-11"   # oldest Street View imagery scripts/validate_streetview.py counts
holidays: data/holidays/mill_valley_refuse.yaml
trash: {kind: weekly, holiday_rule: next_day}   # Mill Valley Refuse: the user picks the day
source:
  local_path: data/belvedere/StreetSweeping.geojson
  build: scripts/build_belvedere_geojson.py
  arcgis:
    # Marin County roads (MarinMap, provided as is): blocks and address ranges.
    centerlines.geojson:
      url: https://services6.arcgis.com/T8eS7sop5hLmgRRH/arcgis/rest/services/Roads/FeatureServer/0
      where: "City='Belvedere'"
  notes: |
    The build reads the route lists of https://cityofbelvedere.gov/street-sweeping/
    (map: https://storage.googleapis.com/proudcity/belvedereca/2023/05/Street-Sweeping-Map.jpeg).
