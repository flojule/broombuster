name: "Alameda, CA"
center: {lat: 37.7652, lon: -122.2416}
schema: alameda
bbox: [37.73, -122.33, 37.79, -122.21]
fgb_path: data/alameda/StreetSweeping.fgb
holidays: data/holidays/alameda.yaml
trash: {kind: weekly, holiday_rule: shift_week}   # ACI Alameda: no lookup, the user picks the day
layers: [ev, markets]   # scripts/build_layers.py (layer_sources.py)
source:
  local_path: data/alameda/StreetSweeping.geojson
  build: scripts/build_alameda_geojson.py
  arcgis:
    # The city's sweeping map (day, posted time, signed or not per block); no geometry served.
    schedule.geojson: https://mobile.alamedaca.gov/arcgis/rest/services/Streets_Sweeping/MapServer/0
    # Alameda County street centerlines: the same blocks, with geometry.
    centerlines.geojson:
      url: https://services5.arcgis.com/ROBnTHSNjoZ2Wm1P/arcgis/rest/services/Street_Centerlines/FeatureServer/0
      where: "MUNL='AA' OR MUNR='AA'"
  notes: |
    The map is embedded in
    https://www.alamedaca.gov/Departments/Public-Works-Department/Street-Sweeping-Program
