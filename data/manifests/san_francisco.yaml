name: "San Francisco, CA"
source_updated: "2026-05"   # when the city last edited its sweeping source
center: {lat: 37.7749, lon: -122.4194}
schema: sf
bbox: [37.70, -122.53, 37.84, -122.35]
fgb_path: data/san_francisco/StreetSweeping.fgb
streetview_since: "2023-11"   # oldest Street View imagery scripts/validate_streetview.py counts
holidays: data/holidays/san_francisco.yaml
corrections: data/san_francisco/corrections.yaml
trash: {kind: weekly, holiday_rule: shift_week}   # Recology: no lookup, the user picks the day
layers: [parking, meters, ev, markets]   # scripts/build_layers.py (layer_sources.py)
source:
  local_path: data/san_francisco/StreetSweeping.geojson
  build: scripts/build_san_francisco_geojson.py
  files:
    # Sweeping schedule; 22 rows carry no geometry.
    - "https://data.sf.gov/resource/yhqp-riqs.geojson?$limit=200000"
    # Street centerlines: geometry by cnn for those rows.
    - "https://data.sf.gov/resource/3psu-pn9h.geojson?$limit=300000&$select=cnn,line"
  arcgis:
    # San Francisco County (Census TIGER): curbs outside it are another city's.
    county.geojson:
      url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1
      where: "GEOID='06075'"
