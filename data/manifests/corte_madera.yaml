name: "Corte Madera, CA"
source_updated: "2026-11"   # Mill Valley Refuse Service's sweeping lists, as read
center: {lat: 37.9255, lon: -122.5150}
schema: prebuilt
bbox: [37.905, -122.540, 37.941, -122.485]
fgb_path: data/corte_madera/StreetSweeping.fgb
streetview_since: "2023-11"   # oldest Street View imagery scripts/validate_streetview.py counts
holidays: data/holidays/mill_valley_refuse.yaml
trash: {kind: weekly, holiday_rule: next_day}   # Mill Valley Refuse: the user picks the day
source:
  local_path: data/corte_madera/StreetSweeping.geojson
  build: scripts/build_corte_madera_geojson.py
  arcgis:
    # Marin County roads (MarinMap, provided as is): blocks and address ranges.
    centerlines.geojson:
      url: https://services6.arcgis.com/T8eS7sop5hLmgRRH/arcgis/rest/services/Roads/FeatureServer/0
      where: "City='Corte Madera'"
  notes: |
    The build reads the Corte Madera tab of
    https://www.millvalleyrefuse.com/residential-street-sweeping and the Town's public works
    schedule https://www.townofcortemadera.org/DocumentCenter/View/4722, both linked on
    https://www.townofcortemadera.org/244/Street-Sweeping
