name: "Emeryville, CA"
source_updated: "2024-08"   # when the city last edited its sweeping source
center: {lat: 37.8380, lon: -122.2900}
schema: prebuilt
bbox: [37.82, -122.32, 37.85, -122.27]
fgb_path: data/emeryville/StreetSweeping.fgb
streetview_since: "2023-11"   # oldest Street View imagery scripts/validate_streetview.py counts
holidays: data/holidays/emeryville.yaml
trash: {kind: weekly, holiday_rule: shift_week}   # WM of Alameda County: the user picks the day
source:
  local_path: data/emeryville/StreetSweeping.geojson
  build: scripts/build_emeryville_geojson.py
  arcgis:
    # The city's sweeping routes: week, weekday and time per line (curb lines on some blocks).
    routes.geojson: https://services3.arcgis.com/ljOdqLVbHpS7dOJQ/arcgis/rest/services/Street_Sweeping_Routes_Authoritative_view/FeatureServer/0
    # Alameda County street centerlines without freeways and ramps: blocks and address ranges.
    centerlines.geojson:
      url: https://services5.arcgis.com/ROBnTHSNjoZ2Wm1P/arcgis/rest/services/Street_Centerlines/FeatureServer/0
      where: "(MUNL='EM' OR MUNR='EM') AND CLASS NOT IN ('Interstate', 'Ramp', 'Freeway or Expressway')"
  notes: |
    Sides of "1st or 2nd" Thursday streets:
    https://www.emeryville.org/Services/Getting-Around-Emeryville/Paid-Parking
