# Sweeping: none on city-observed holidays (city holiday schedule; a Saturday holiday is
# observed Friday, a Sunday one Monday; 2027 by that rule). Christmas Eve and New Year's Eve
# are half days and keep sweeping.
# Trash (South San Francisco Scavenger, https://ssfscavenger.com/holiday-schedule/): no pickup
# on Christmas and New Year's Day; that pickup is the next day.
