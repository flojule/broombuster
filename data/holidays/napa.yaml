  - {date: 2026-11-26, name: Thanksgiving Day, suspends: [sweeping, trash]}
  - {date: 2026-12-25, name: Christmas Day, suspends: [sweeping, trash]}
  - {date: 2027-01-01, name: New Year's Day, suspends: [sweeping, trash]}
  - {date: 2027-11-25, name: Thanksgiving Day, suspends: [sweeping, trash]}
  - {date: 2027-12-25, name: Christmas Day, suspends: [sweeping, trash]}
