# Sweeping (city page): none on Thanksgiving, Christmas and New Year's Day; those streets are
# swept the following weekday (the build moves the DATES codes).
# Trash (Napa Recycling & Waste Services, naparecycling.com/collection-schedule): no pickup
# on the same three days; pickups later that week are one day late.
source: https://www.cityofnapa.org/367/Street-Sweeping
