# Trash (Republic Services): pickups on or after New Year's Day, Thanksgiving and Christmas
# are one day late that week.
# Sweeping (the city's Street Sweeping Residential Areas layer): no sweeping on the same
# three days; those streets are swept the next day (the build moves the DATES codes).
