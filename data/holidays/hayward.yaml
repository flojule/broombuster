# Sweeping: the city's holidays, no sweeping; a Saturday holiday is observed the Friday
# before, a Sunday one the Monday after. Christmas Eve 2027 is not listed: Christmas is
# observed that Friday and the city gives no other day. The city also stops sweeping and
# enforcement during its Thanksgiving, Christmas and New Year's business closure weeks;
# those dates are not yet published, so they are not listed.
# Trash (WM of Alameda County, https://www.wm.com/us/local/ca/hayward/residential): no
# collection on Thanksgiving, Christmas and New Year's Day; on a weekday holiday the rest
# of that week is collected one day later.
