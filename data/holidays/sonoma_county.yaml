# Trash (Recology Sonoma Marin, unincorporated Sonoma County): no service on New Year's Day,
# Independence Day (observed weekday), Labor Day, Thanksgiving and Christmas; later pickups
# that week are assumed one day late. 2027 after New Year's Day follows the same list.
# Sweeping: the 2026 calendar sweeps on holidays, so none is suspended.
source: https://www.recology.com/recology-sonoma-marin/holiday-calendar/
last_verified: 2026-11-17
holidays:
  - {date: 2026-01-01, name: New Year's Day, suspends: [trash]}
  - {date: 2026-07-03, name: Independence Day (observed), suspends: [trash]}
  - {date: 2026-09-07, name: Labor Day, suspends: [trash]}
  - {date: 2026-11-26, name: Thanksgiving Day, suspends: [trash]}
  - {date: 2026-12-25, name: Christmas Day, suspends: [trash]}
  - {date: 2027-01-01, name: New Year's Day, suspends: [trash]}
  - {date: 2027-07-05, name: Independence Day (observed), suspends: [trash]}
  - {date: 2027-09-06, name: Labor Day, suspends: [trash]}
  - {date: 2027-11-25, name: Thanksgiving Day, suspends: [trash]}
  - {date: 2027-12-25, name: Christmas Day, suspends: [trash]}
