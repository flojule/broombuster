# Sweeping: "restricted parking for street sweeping will not be enforced on these City
# holidays" (2026 list; 2027 by the same holidays, a weekend one observed on the weekday next
# to it). The 2025-26 year-end break also covered Jan 2 2026.
# Trash (Republic Services Daly City): no pickup on Christmas and New Year's Day; that
# pickup is made up the Saturday after.
