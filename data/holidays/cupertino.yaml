# Trash (Recology South Bay): no collection on Thanksgiving, Christmas and New Year's Day;
# that day's and the rest of the week's pickups are one day later.
# Sweeping: the city skips city-observed holidays, but its holiday list is not published in
# a form we can fetch, so no sweeping holiday is assumed.
source: https://cupertino.gov/Your-City/Divisions/Environment-Sustainability/Garbage-and-Recycling/Rates-and-Collection-Schedule
last_verified: 2026-11-17
holidays:
  - {date: 2026-01-01, name: New Year's Day, suspends: [trash]}
  - {date: 2026-11-26, name: Thanksgiving Day, suspends: [trash]}
  - {date: 2026-12-25, name: Christmas Day, suspends: [trash]}
  - {date: 2027-01-01, name: New Year's Day, suspends: [trash]}
  - {date: 2027-11-25, name: Thanksgiving Day, suspends: [trash]}
  - {date: 2027-12-25, name: Christmas Day, suspends: [trash]}
