name: Visual

# Every layout scenario (scripts/visual_scenarios.py) on pull requests: screenshots,
# layout checks and axe-core accessibility checks. Kept out of ci.yml so it never
# gates the Pi's auto-deploy (deploy/auto-update.sh waits on ci.yml only).
on:
  pull_request:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra api --extra visual
      - run: uv run --extra visual playwright install --with-deps webkit chromium
      - run: uv run --extra visual python scripts/visual_scenarios.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-scenarios
          path: build/visual/
          retention-days: 14
