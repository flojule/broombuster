name: CI

# Lint + test on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a force-push doesn't pile up jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (api + dev extras, locked)
        run: uv sync --locked --extra api --extra dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Pytest
        # conftest.py sets DEV_MODE (no JWT_SECRET needed) and a throwaway
        # DB_PATH. Node (preinstalled on the runner) runs the JS parity tests.
        run: uv run pytest -q
