name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra api --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q   # node (preinstalled) runs tests/test_urgency.py
      - name: Frontend scripts parse
        run: |
          node --version
          for f in frontend/js/*.js frontend/sw.js; do
            [ "$f" = frontend/js/maplibre-global.js ] && continue   # ES module
            node --check "$f"
          done
