<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BroomBuster</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="description" content="Know when street sweeping applies to your parked car.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BroomBuster">
  <meta property="og:title" content="BroomBuster: Know before the grim sweeper comes.">
  <meta property="og:description" content="Know when street sweeping applies to your parked car.">
  <meta property="og:url" content="__BASE_URL__/">
  <meta property="og:image" content="__BASE_URL__/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A hooded reaper sweeping a street of parked cars with ticket-stamped windshields">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BroomBuster">
  <meta name="theme-color" content="#ecefea">

  <link rel="stylesheet" href="/vendor/maplibre-gl.css">
  <script src="/vendor/pmtiles.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-10.5a6 6 0 0 1 12 0C18 15.4 12 21 12 21z"/><circle cx="12" cy="10.5" r="2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path fill="currentColor" fill-opacity=".2" d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2" fill="var(--icon-hole, none)"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2" fill="var(--icon-hole, none)"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path fill="currentColor" fill-opacity=".2" stroke="none" d="M6 10 12 5l6 5v10H6z"/><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5M10 20v-5h4v5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3L12 4zM12 10v4M12 17h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  </defs>
</svg>

<div id="app-screen">
  <div id="map-container">
    <div id="map"></div>

    <!-- Right column (map controls): menu, zoom (desktop), locate. -->
    <div id="map-ctrl">
      <button id="btn-menu" class="map-btn" title="Menu" aria-label="Menu" aria-haspopup="menu" aria-expanded="false" aria-controls="app-menu"><svg class="ic"><use href="#i-more"/></svg></button>
      <button id="btn-zoom-in" class="map-btn zoom-btn" title="Zoom in" aria-label="Zoom in"><svg class="ic"><use href="#i-plus"/></svg></button>
      <button id="btn-zoom-out" class="map-btn zoom-btn" title="Zoom out" aria-label="Zoom out"><svg class="ic"><use href="#i-minus"/></svg></button>
      <button id="btn-locate" class="map-btn" title="Use GPS location" aria-label="Use GPS location"><svg class="ic"><use href="#i-locate"/></svg></button>
    </div>

    <!-- Floating pill shown during place mode: pan so the center target sits on
         the spot, then confirm. (Right-click is the desktop alternative.) -->
    <div id="place-banner">
      <span id="place-banner-text"></span>
      <button id="btn-confirm-place">Set here</button>
      <button id="btn-cancel-place">Cancel</button>
    </div>

    <!-- Right-click context menu -->
    <div id="ctx-menu">
      <div class="ctx-item" id="ctx-add-car"><svg class="ic"><use href="#i-plus"/></svg> Add car here</div>
      <div class="ctx-item" id="ctx-add-home"><svg class="ic"><use href="#i-home"/></svg> Add home here</div>
    </div>

    <!-- Bottom sheet: cars & homes. Empty: just the two add buttons. Otherwise it
         minimizes to a handle so the map (and placement's center target) stays
         clear. Body order: add-row, home cards, then car cards
         (appended by renderCarsPanel). -->
    <div id="sheet">
      <div id="sheet-handle" role="button" tabindex="0" aria-label="Minimize or show cars & homes">
          <span id="sheet-summary"></span>
        <span id="sheet-chevron"><svg class="ic"><use href="#i-chevron"/></svg></span>
      </div>
      <div id="cars-panel">
        <div id="add-row">
          <button id="btn-add-home" class="add-car-btn add-home-btn" title="Add a home to see trash & recycling day"><svg class="ic"><use href="#i-home"/></svg> Add home</button>
          <button id="btn-add-car" class="add-car-btn"><svg class="ic"><use href="#i-car"/></svg> Add car</button>
        </div>
        <div id="home-panel"></div>
      </div>
    </div>

    <!-- Center target: marks the point the street sign reads -->
    <div id="center-crosshair"></div>

    <!-- Street sign for the street at the target: schedule as published. -->
    <div id="street-sign" hidden>
      <div id="ss-head">No parking</div>
      <div id="ss-lines"></div>
      <div id="ss-foot">Street sweeping</div>
      <div id="ss-name"></div>
    </div>

    <!-- Calendar: fixed content (strip, or month view on tap); the street under
         the target and the cars appear only as marks on its days. -->
    <div id="info-card">
      <div id="ic-head" role="button" tabindex="0" aria-expanded="false">
        <span id="ic-title"><svg class="ic"><use href="#i-calendar"/></svg>&nbsp;Calendar</span>
        <span id="ic-chevron"><svg class="ic"><use href="#i-chevron"/></svg></span>
      </div>
      <div id="ic-cal"></div>
    </div>
  </div>
</div>

<!-- App menu: account (when sign-in is on), appearance, map colors, about. Account part filled by js/account.js. -->
<div id="app-menu" role="menu" hidden>
  <div class="menu-sec" id="menu-account" hidden></div>
  <div class="menu-sec">
    <div class="menu-label">Appearance</div>
    <div class="seg" id="theme-seg" role="radiogroup" aria-label="Appearance">
      <button type="button" role="radio" data-theme="auto">Auto</button>
      <button type="button" role="radio" data-theme="light">Light</button>
      <button type="button" role="radio" data-theme="dark">Dark</button>
    </div>
  </div>
  <div class="menu-sec menu-legend">
    <div class="menu-label">Map colors</div>
    <span class="urg-today"><i class="lg lg-3"></i>Today</span>
    <span class="urg-tomorrow"><i class="lg lg-2"></i>Tomorrow</span>
    <span class="urg-safe"><i class="lg lg-1"></i>Clear</span>
    <span class="urg-none"><i class="lg lg-0"></i>No sweeping</span>
  </div>
  <div class="menu-sec menu-about"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a> · <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> · __APP_VERSION__</div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- MapLibre 6 is ESM-only; expose it as a global before the deferred app scripts run. -->
<script type="module" src="/js/maplibre-global.js"></script>
<script defer src="js/urgency.js"></script>
<script defer src="js/core.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/map.js"></script>
<script defer src="js/markers.js"></script>
<script defer src="js/calendar.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/account.js"></script>
<script defer src="js/cars.js"></script>
<script defer src="js/homes.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
