<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BroomBuster</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BroomBuster">
  <meta name="theme-color" content="#2563eb">

  <script src="/config.js"></script>
  <link rel="stylesheet" href="/vendor/maplibre-gl.css">
  <script src="/vendor/pmtiles.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ══════════════════ AUTH OVERLAY (optional) ══════════════════ -->
<div id="auth-screen" hidden>
  <div class="card">
    <button id="btn-auth-close" class="popup-close" title="Close (Esc)" aria-label="Close">✕</button>
    <h2>Sign in</h2>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    <div id="auth-error"></div>
    <button id="btn-login">Sign in</button>
    <button class="btn-ghost" id="btn-signup">Create account</button>
  </div>
</div>

<!-- ══════════════════ APP SCREEN ══════════════════ -->
<div id="app-screen">
  <div id="topbar">
    <span class="app-title" title="BroomBuster">🧹</span>
    <span class="tb-sep"></span>
    <select id="region-select" class="tb-select"></select>
    <span class="tb-sep"></span>
    <span id="status-text" class="idle">—</span>
    <span id="locate-info"></span>
    <button id="btn-locate" class="tb-btn" title="Use GPS location">📍</button>
    <span class="tb-sep"></span>
    <button id="btn-dark-mode" class="tb-btn" title="Toggle dark mode">🌙</button>
    <button id="btn-signin" class="tb-btn">Sign in</button>
    <button id="btn-logout" class="tb-btn" hidden>Sign out</button>
  </div>
  <div id="map-container">
    <div id="map"></div>

    <!-- Floating pill shown during place mode: pan so the center target sits on
         the spot, then confirm. (Right-click is the desktop alternative.) -->
    <div id="place-banner">
      <span id="place-banner-text">Move the map to aim the target</span>
      <button id="btn-confirm-place">Place here</button>
      <button id="btn-cancel-place">Cancel</button>
    </div>

    <!-- Right-click context menu -->
    <div id="ctx-menu">
      <div class="ctx-item" id="ctx-add-car">+ Add car here</div>
      <div class="ctx-item" id="ctx-add-home">🏠 Set home here</div>
    </div>

    <!-- Bottom sheet: cars & homes. Collapses to a handle so the map stays
         clear (and so placement's center target is unobstructed). Body order:
         legend, home-panel (add-home + home cards), add-car, then car cards
         (appended by renderCarsPanel). -->
    <div id="sheet">
      <div id="sheet-handle" role="button" tabindex="0" aria-label="Toggle cars & homes panel">
        <span id="sheet-grip"></span>
        <span id="sheet-summary"></span>
        <span id="sheet-chevron">▾</span>
      </div>
      <div id="cars-panel">
        <div id="map-legend" class="cars-legend">
          <span class="urg-today">■ Today</span>
          <span class="urg-tomorrow">■ Tomorrow</span>
          <span class="urg-safe">■ Clear</span>
        </div>
        <div id="home-panel"></div>
        <button id="btn-add-car" class="add-car-btn">🚗 Add car</button>
      </div>
    </div>

    <!-- GPS "you are here" pin popup -->
    <div id="gps-pin-popup">
      <button id="btn-gps-add">📍 Add car here</button>
      <button id="btn-gps-close" class="popup-close inline-close" title="Close (Esc)" aria-label="Close">✕</button>
    </div>

    <!-- Center crosshair: marks the point the center banner reads -->
    <div id="center-crosshair"></div>

    <!-- Center banner: live readout of the street at the viewport center -->
    <div id="snap-chip"></div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- ══════════════════ CARD SCHEDULE DETAIL WINDOW ══════════════════ -->
<!-- Same content as a street/ward click, shown without a map-anchored arrow. -->
<div id="card-detail">
  <button id="btn-card-detail-close" class="popup-close" title="Close (Esc)" aria-label="Close">✕</button>
  <div id="card-detail-body"></div>
</div>

<!-- ══════════════════ CUSTOM HOVER ══════════════════ -->
<div id="custom-hover"></div>

<!-- MapLibre 6 is ESM-only; expose it as a global before the deferred app scripts run. -->
<script type="module">
  import * as maplibregl from '/vendor/maplibre-gl.mjs';
  window.maplibregl = maplibregl;
</script>
<script defer src="js/urgency.js"></script>
<script defer src="js/core.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/map.js"></script>
<script defer src="js/markers.js"></script>
<script defer src="js/calendar.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/cars.js"></script>
<script defer src="js/homes.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
