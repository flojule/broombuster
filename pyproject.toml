[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "broombuster"
version = "0.1.0"
description = "Street-sweeping schedule alerts."
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2",
    "shapely>=2.1",
    "pyproj>=3.8",
    "geopy>=2.5",
    "requests>=2.34",
    "numpy>=2.5",
    "pandas>=3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
]
scripts = [
    "pdfplumber>=0.11.10",
]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "httpx2>=2.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # en dashes and emoji are intentional
    "B008",                        # FastAPI Depends() in defaults
    "SIM105", "SIM108",            # explicit try/except and if/else read better here
]

[tool.ruff.lint.per-file-ignores]
"scripts/visual_scenarios.py" = ["E501"]  # embedded JS and one-line scenario tables

[tool.ruff.lint.isort]
known-first-party = ["broombuster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
