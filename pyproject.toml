[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "broombuster"
version = "0.1.0"
description = "Street-sweeping schedule alerts."
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2",
    "shapely>=2.1",
    "pyproj>=3.8",
    "geopy>=2.5",
    "requests>=2.34",
    "numpy>=2.5",
    "pandas>=3.0",
    "python-dotenv>=1.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "PyJWT>=2.15",
    "bcrypt>=5.0",
    "slowapi>=0.1.10",
]
scripts = [
    "pdfplumber>=0.11.10",
]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "httpx2>=2.13",
]

# Layout: a single importable package under src/broombuster/. setuptools'
# packages.find auto-discovers every sub-package (api, cli, domains, …).
# Adding new code anywhere under src/broombuster/ requires no pyproject
# change — drop a file in, run `pip install -e .`, and import it as
# `broombuster.<path>`.
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["broombuster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pip install -e .` puts `src/` on the import path via the editable
# install's finder, so `import broombuster` works without any further
# pythonpath config.
addopts = "-ra --strict-markers"
